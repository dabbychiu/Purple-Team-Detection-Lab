<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detection Coverage — MITRE ATT&CK Enterprise</title>
<style>
:root{
  --bg:#0b0e14; --panel:#111621; --panel2:#161d2b; --line:#232c3d;
  --ink:#e7ecf3; --dim:#8794a8; --faint:#5a6577;
  --covered:#e8b830;      /* 黃：有覆蓋 */
  --covered-ink:#1a1400;
  --qradar:#c02a63;       /* 紫紅：QRadar 實戰 */
  --sentinel:#2f6bd6;     /* 藍：Sentinel lab */
  --empty:#151b27;        /* 灰：無覆蓋 */
  --shadow:0 8px 30px rgba(0,0,0,.4);
  --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:0 0 80px}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b0e14 60%,rgba(11,14,20,.85));
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);padding:18px 22px 14px;
}
.hrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--qradar);text-transform:uppercase;font-weight:600}
h1{font-size:20px;margin:2px 0 0;font-weight:650;letter-spacing:-.01em}
.ver{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-left:auto}
.sub{color:var(--dim);font-size:13px;margin-top:3px;max-width:70ch;line-height:1.5}

/* ---- stat strip ---- */
.stats{display:flex;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.stat{flex:1;min-width:120px;padding:10px 14px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1}
.stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin-top:5px}
.stat.q .n{color:var(--qradar)} .stat.s .n{color:var(--sentinel)} .stat.c .n{color:var(--covered)}

/* ---- controls ---- */
.controls{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.controls input[type=search]{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:8px 12px;border-radius:7px;font-size:13px;min-width:200px;flex:1;font-family:var(--sans)
}
.controls input::placeholder{color:var(--faint)}
.chip{font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);cursor:pointer;user-select:none;transition:.12s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.on{background:var(--panel2);color:var(--ink);border-color:var(--faint)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chip.q .dot{background:var(--qradar)} .chip.s .dot{background:var(--sentinel)} .chip.c .dot{background:var(--covered)}

/* ---- matrix ---- */
.scroll{overflow-x:auto;padding:18px 22px}
.matrix{display:flex;gap:8px;min-width:max-content}
.col{width:190px;flex:0 0 190px;display:flex;flex-direction:column;gap:5px}
.chead{position:sticky;top:0}
.chead .cid{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em}
.chead .cname{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:2px;min-height:32px;color:var(--ink)}
.chead .ccount{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
.chead{padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-bottom:3px}

/* ---- technique cell ---- */
.cell{background:var(--empty);border:1px solid var(--line);border-radius:6px;padding:8px 9px;cursor:pointer;
  transition:.12s;position:relative;overflow:hidden}
.cell:hover{border-color:var(--faint);transform:translateY(-1px)}
.cell.covered{background:linear-gradient(135deg,rgba(232,184,48,.14),rgba(232,184,48,.05));border-color:rgba(232,184,48,.5)}
.cell.covered::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--covered)}
.cell .tid{font-family:var(--mono);font-size:10px;color:var(--faint)}
.cell.covered .tid{color:var(--covered)}
.cell .tname{font-size:12px;line-height:1.3;margin-top:2px;color:var(--ink)}
.cell.dim .tname{color:var(--dim)}
.cell .badges{display:flex;gap:4px;margin-top:6px;align-items:center;min-height:14px}
.b{font-family:var(--mono);font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.03em}
.b.q{background:rgba(192,42,99,.18);color:#ff7aa8;border:1px solid rgba(192,42,99,.5)}
.b.s{background:rgba(47,107,214,.18);color:#7fb0ff;border:1px solid rgba(47,107,214,.5)}
.b.sub{margin-left:auto;color:var(--faint);font-size:9px;font-family:var(--mono)}

.cell.na{opacity:.42;background:repeating-linear-gradient(135deg,var(--empty),var(--empty) 6px,#10141d 6px,#10141d 12px);border-style:dashed}
.cell.na:hover{opacity:.7}
.cell.na .tname{color:var(--faint)}
.b.na{background:rgba(90,101,119,.18);color:var(--faint);border:1px solid var(--faint)}
.chip.na .dot{background:var(--faint)}
.section.na h3{color:var(--faint)} .section.na .sw{background:var(--faint)}
.na-note{font-size:12px;color:var(--faint);line-height:1.5;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:6px;padding:10px 12px}

.col{position:relative}
.matrix .col:not(:first-child)::before{content:"";position:absolute;left:-4px;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.chead{border-top:3px solid var(--tacc,#39435a)}
.chead .cname{color:var(--tacc,var(--ink))}
.subrow.cov-q{background:rgba(192,42,99,.16);border-color:rgba(192,42,99,.55)}
.subrow.cov-q .sid{color:#ff7aa8}
.subrow.cov-s{background:rgba(47,107,214,.16);border-color:rgba(47,107,214,.55)}
.subrow.cov-s .sid{color:#7fb0ff}
.subrow.cov-qs{background:linear-gradient(90deg,rgba(192,42,99,.16),rgba(47,107,214,.16));border-color:rgba(130,90,170,.55)}

.det.q{background:rgba(192,42,99,.14);border-color:rgba(192,42,99,.5)}
.det.s{background:rgba(47,107,214,.14);border-color:rgba(47,107,214,.5)}
.ddesc{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--dim);margin-top:8px;padding:8px 10px;background:rgba(0,0,0,.25);border-radius:5px;white-space:pre-wrap;word-break:break-word}
.cell.hidden{display:none}
.col.hidden{display:none}

/* ---- detail drawer ---- */
.overlay{position:fixed;inset:0;background:rgba(4,6,10,.6);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:.18s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--panel);border-left:1px solid var(--line);
  z-index:101;transform:translateX(100%);transition:.22s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.drawer.show{transform:translateX(0)}
.dhead{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.dhead .dtac{font-family:var(--mono);font-size:10px;color:var(--sentinel);letter-spacing:.16em;text-transform:uppercase}
.dhead .did{font-family:var(--mono);font-size:12px;color:var(--covered);margin-top:8px}
.dhead h2{font-size:19px;margin:4px 0 0;font-weight:650;letter-spacing:-.01em}
.dhead a.ext{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;margin-top:10px;display:inline-block;border-bottom:1px dotted var(--faint)}
.dhead a.ext:hover{color:var(--ink)}
.dclose{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--line);color:var(--dim);
  width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;line-height:1}
.dclose:hover{color:var(--ink);border-color:var(--faint)}
.dbody{overflow-y:auto;padding:6px 22px 30px;flex:1}
.section{margin-top:22px}
.section h3{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;
  display:flex;align-items:center;gap:8px}
.section h3 .sw{width:10px;height:10px;border-radius:2px}
.section.q h3{color:#ff7aa8} .section.q .sw{background:var(--qradar)}
.section.s h3{color:#7fb0ff} .section.s .sw{background:var(--sentinel)}
.det{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin-bottom:8px}
.det .dn{font-size:13px;font-weight:550;line-height:1.35}
.det a.link{font-family:var(--mono);font-size:11px;color:var(--sentinel);text-decoration:none;margin-top:7px;
  display:inline-flex;align-items:center;gap:5px;word-break:break-all}
.det a.link:hover{text-decoration:underline}
.det.q a.link{color:#ff7aa8}
.none{color:var(--faint);font-size:12px;font-style:italic;padding:4px 0}
.subwrap{margin-top:8px}
.subrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  margin-bottom:5px;background:var(--panel2)}
.subrow .sid{font-family:var(--mono);font-size:10px;color:var(--faint)}
.subrow.covered .sid{color:var(--covered)}
.subrow .sname{font-size:12px;flex:1;color:var(--dim)}
.subrow.covered .sname{color:var(--ink)}
.subrow .sb{font-family:var(--mono);font-size:8.5px;font-weight:600;padding:1px 4px;border-radius:3px}
.subrow .sb.q{background:rgba(192,42,99,.18);color:#ff7aa8} .subrow .sb.s{background:rgba(47,107,214,.18);color:#7fb0ff}

.hint{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;padding:24px}
.hint code{color:var(--dim);background:var(--panel);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}

@media(max-width:640px){
  .scroll{padding:12px}
  .col{width:150px;flex-basis:150px}
  h1{font-size:17px} .stat{min-width:90px}
}
</style>
</head>

<div class="scroll"><div class="matrix" id="matrix"></div></div>

<div class="overlay" id="overlay"></div>

// try to load external coverage.json (for GitHub Pages workflow); fall back to embedded sample
async function loadCoverage(){
  try{
    const r = await fetch('coverage.json',{cache:'no-store'});
    if(r.ok){ COVERAGE = await r.json(); }
  }catch(e){/* offline / file://, keep embedded */}
  render();
}

function covOf(id){ return COVERAGE[id] || null; }
function isNA(id){ const c=COVERAGE[id]; return !!(c && c.detectable===false); }
function hasCov(id){ const c=covOf(id); return !!(c && ((c.qradar&&c.qradar.length)||(c.sentinel&&c.sentinel.length))); }
// a technique counts as "covered" if it or any sub is covered

// tactic-aware coverage check for a technique id within a specific tactic column
function covInTactic(id, short){
  const c=covOf(id); if(!c) return {q:false,s:false};
  const q=rulesForTactic(c.qradar,short).length>0;
  const s=rulesForTactic(c.sentinel,short).length>0;
  return {q,s};
}
function hasCovInTactic(id, short){ const r=covInTactic(id,short); return r.q||r.s; }

function techCovered(t, short){
  if(short===undefined){
    if(hasCov(t.id)) return true;
    return (t.subtechniques||[]).some(s=>hasCov(s.id));
  }
  if(hasCovInTactic(t.id,short)) return true;
  return (t.subtechniques||[]).some(s=>hasCovInTactic(s.id,short));
}
function techSources(t, short){
  let q=false,s=false;
  const scan=id=>{
    if(short===undefined){const c=covOf(id); if(c){if(c.qradar&&c.qradar.length)q=true; if(c.sentinel&&c.sentinel.length)s=true;}}
    else {const r=covInTactic(id,short); if(r.q)q=true; if(r.s)s=true;}
  };
  scan(t.id); (t.subtechniques||[]).forEach(x=>scan(x.id));
  return {q,s};
}


// normalize a tactic ref (shortname like "initial-access" OR id like "TA0001") -> shortname
const TA_ID2SHORT={};
Object.entries(ATTACK.tactics).forEach(([short,info])=>{TA_ID2SHORT[info.id.toUpperCase()]=short;});
function normTactic(x){
  if(!x) return null;
  const s=String(x).trim();
  if(/^TA\d+$/i.test(s)) return TA_ID2SHORT[s.toUpperCase()]||null;
  return s.toLowerCase();
}
// does a rule (with optional .tactic) apply to this tactic column?
function ruleInTactic(rule, short){
  const rt=normTactic(rule.tactic);
  return rt===null || rt===short;   // no tactic = applies everywhere (back-compat)
}
// filter a coverage entry's rules down to those relevant to a given tactic column
function rulesForTactic(list, short){
  if(!list) return [];
  return list.filter(r=>ruleInTactic(r,short));
}
const TAC_COLORS={
'reconnaissance':'#8b6db8','resource-development':'#6d7fb8','initial-access':'#5b93c7',
'execution':'#3fa3a3','persistence':'#3fa86b','privilege-escalation':'#6fae3f',
'stealth':'#b8a13f','defense-impairment':'#c79a4a','credential-access':'#d67f4a',
'discovery':'#d65f8a','lateral-movement':'#c74a9e','collection':'#9a5fd6',
'command-and-control':'#5f6fd6','exfiltration':'#4a9ec7','impact':'#d64a4a'};
let filters={covered:false,qradar:false,sentinel:false,showna:false};
let query='';

function render(){
  document.getElementById('ver').textContent = ATTACK.version;
  buildStats();
  buildMatrix();
}

function buildStats(){
  const techs=ATTACK.techniques;
  const naCount=techs.filter(t=>isNA(t.id)).length;
  const total=techs.length-naCount;               // 可偵測技術才算分母
  const covered=techs.filter(t=>!isNA(t.id)&&techCovered(t)).length;
  let qCount=0,sCount=0;
  Object.values(COVERAGE).forEach(c=>{qCount+=(c.qradar||[]).length; sCount+=(c.sentinel||[]).length;});
  const pct=total?Math.round(covered/total*100):0;
  document.getElementById('stats').innerHTML=`
    <div class="stat c"><div class="n">${covered}/${total}</div><div class="l">可偵測技術覆蓋 ${pct}%</div></div>
    <div class="stat q"><div class="n">${qCount}</div><div class="l">QRadar 規則</div></div>
    <div class="stat s"><div class="n">${sCount}</div><div class="l">Sentinel KQL</div></div>
    <div class="stat"><div class="n">${naCount}</div><div class="l">不可偵測 (N/A)</div></div>`;
}

function matchQuery(t){
  if(!query) return true;
  const q=query.toLowerCase();
  if(t.id.toLowerCase().includes(q)||t.name.toLowerCase().includes(q)) return true;
  return (t.subtechniques||[]).some(s=>s.id.toLowerCase().includes(q)||s.name.toLowerCase().includes(q));
}
function passFilter(t, short){
  const na=isNA(t.id);
  if(na && !filters.showna) return false;          // 預設隱藏不可偵測
  const src=techSources(t, short);
  if(filters.covered && !techCovered(t, short)) return false;
  if(filters.qradar && !src.q) return false;
  if(filters.sentinel && !src.s) return false;
  return matchQuery(t);
}

function buildMatrix(){
  const m=document.getElementById('matrix'); m.innerHTML='';
  ATTACK.tactic_order.forEach(short=>{
    const tac=ATTACK.tactics[short];
    const techs=ATTACK.techniques.filter(t=>t.tactics.includes(short)).sort((a,b)=>a.id.localeCompare(b.id));
    const visible=techs.filter(t=>passFilter(t, short));
    const col=document.createElement('div'); col.className='col'+(visible.length?'':' hidden');
    const tcolor=TAC_COLORS[short]||'#39435a';
    col.style.setProperty('--tacc',tcolor);
    const covCount=techs.filter(t=>!isNA(t.id)&&techCovered(t, short)).length;
    const denom=techs.filter(t=>!isNA(t.id)).length;
    col.innerHTML=`<div class="chead" style="--tacc:${tcolor}"><div class="cid">${tac.id}</div>
      <div class="cname">${tac.name}</div>
      <div class="ccount">${covCount}/${denom} covered</div></div>`;
    visible.forEach(t=>{
      const na=isNA(t.id);
      const src=techSources(t, short);
      const cov=!na&&techCovered(t, short);
      const cell=document.createElement('div');
      cell.className='cell'+(na?' na':(cov?' covered':' dim'));
      const subCount=(t.subtechniques||[]).length;
      cell.innerHTML=`<div class="tid">${t.id}</div>
        <div class="tname">${t.name}</div>
        <div class="badges">
          ${na?'<span class="b na">N/A</span>':''}
          ${!na&&src.q?'<span class="b q">QRADAR</span>':''}
          ${!na&&src.s?'<span class="b s">KQL</span>':''}
          ${subCount?`<span class="b sub">${subCount} sub</span>`:''}
        </div>`;
      cell.onclick=()=>openDrawer(t,short);
      col.appendChild(cell);
    });
    m.appendChild(col);
  });
}

function detailBlock(list,kind){
  if(!list||!list.length) return '<div class="none">尚無標注</div>';
  return list.map(d=>`<div class="det ${kind}">
    <div class="dn">${escapeHtml(d.name)}</div>
    ${d.desc?`<div class="ddesc">${escapeHtml(d.desc)}</div>`:''}
    ${d.url?`<a class="link" href="${escapeAttr(d.url)}" target="_blank" rel="noopener">↗ ${escapeHtml(d.url)}</a>`:''}
  </div>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escapeAttr(s){return String(s).replace(/"/g,'&quot;');}

function openDrawer(t,short){
  const tac=ATTACK.tactics[short];
  document.getElementById('d-tac').textContent=tac.name+' · '+tac.id;
  document.getElementById('d-id').textContent=t.id;
  document.getElementById('d-name').textContent=t.name;
  document.getElementById('d-ext').href=t.url;
  const c=covOf(t.id)||{};
  let html='';
  if(isNA(t.id)){
    html+=`<div class="section na"><h3><span class="sw"></span>不可偵測 (N/A)</h3>
      <div class="na-note">此技術本質上無法由 SIEM 偵測（例：攻擊前偵察、實體接觸、離線行為），已排除於覆蓋率分母之外。若日後接上對應資料源，於 coverage.json 移除 <code style="font-family:var(--mono)">"detectable": false</code> 即可。</div></div>`;
  }
  // scope rules to the tactic column this drawer was opened from
  const dQ=rulesForTactic(c.qradar, short), dS=rulesForTactic(c.sentinel, short);
  if(dQ.length) html+=`<div class="section q"><h3><span class="sw"></span>QRadar 規則（實戰）</h3>${detailBlock(dQ,'q')}</div>`;
  if(dS.length) html+=`<div class="section s"><h3><span class="sw"></span>Sentinel KQL（Lab）</h3>${detailBlock(dS,'s')}</div>`;
  if(t.subtechniques&&t.subtechniques.length){
    html+=`<div class="section"><h3 style="color:var(--dim)"><span class="sw" style="background:var(--faint)"></span>子技術 ${t.subtechniques.length}</h3><div class="subwrap">`;
    t.subtechniques.forEach(s=>{
      const sc=covOf(s.id)||{};
      const qList=rulesForTactic(sc.qradar, short), sList=rulesForTactic(sc.sentinel, short);
      const hasQ=qList.length>0, hasS=sList.length>0;
      const scov=hasQ||hasS;
      const covClass = hasQ&&hasS ? 'cov-qs' : (hasQ ? 'cov-q' : (hasS ? 'cov-s' : ''));
      html+=`<div class="subrow ${scov?'covered':''} ${covClass}">
        <span class="sid">${s.id}</span>
        <span class="sname">${escapeHtml(s.name)}</span>
        ${hasQ?'<span class="sb q">Q</span>':''}
        ${hasS?'<span class="sb s">S</span>':''}
      </div>`;
      if(hasQ) html+='<div style="margin:0 0 6px 8px">'+detailBlock(qList,'q')+'</div>';
      if(hasS) html+='<div style="margin:0 0 6px 8px">'+detailBlock(sList,'s')+'</div>';
    });
    html+='</div></div>';
  }
  document.getElementById('d-body').innerHTML=html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}
document.getElementById('dclose').onclick=closeDrawer;
document.getElementById('overlay').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim();buildMatrix();});
document.querySelectorAll('.chip').forEach(ch=>{
  ch.onclick=()=>{const f=ch.dataset.f;filters[f]=!filters[f];ch.classList.toggle('on',filters[f]);buildMatrix();};
});

loadCoverage();
</script>
